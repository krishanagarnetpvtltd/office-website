name: Build Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Android lint
        working-directory: android-app
        run: gradle lintRelease --no-daemon

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon

      - name: Verify APK with Android SDK tools
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "=== APK BADGING ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK"
          echo "=== APK SIGNATURE ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "=== ZIPALIGN ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishnanagar-net-android-apk-v3.0.5
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
