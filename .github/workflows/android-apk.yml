name: Build Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create temporary release signing key
        working-directory: android-app
        run: |
          STORE_PASS=$(openssl rand -hex 24)
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v             -keystore ci-release.jks             -storepass "$STORE_PASS"             -keypass "$STORE_PASS"             -alias krishnanagar             -keyalg RSA             -keysize 2048             -startdate "2000/01/01 00:00:00"             -validity 36500             -dname "CN=Krishnanagar Net Pvt Ltd, OU=Mobile, O=Krishnanagar Net Pvt Ltd, L=Krishnanagar, ST=Lumbini, C=NP"

      - name: Run Android lint
        working-directory: android-app
        run: gradle lintRelease --no-daemon

      - name: Build signed release APK
        working-directory: android-app
        env:
          ORG_GRADLE_PROJECT_ciStorePassword: ${{ env.STORE_PASS }}
          ORG_GRADLE_PROJECT_ciKeyPassword: ${{ env.STORE_PASS }}
          ORG_GRADLE_PROJECT_ciKeyAlias: krishnanagar
        run: gradle assembleRelease --no-daemon

      - name: Verify APK with Android SDK tools
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          echo "=== APK BADGING ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK"
          echo "=== APK SIGNATURE ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "=== ZIPALIGN ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishnanagar-net-android-apk-v3.0.4-lint
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
